name: Sync templates from openaustralia/.github

# Mirrors the issue and pull request templates from openaustralia/.github into
# this repo, opening a PR when upstream has changed. CONTRIBUTING.md is
# intentionally excluded and maintained locally -- see CONTRIBUTING.md.
#
# One-time setup: enable "Allow GitHub Actions to create and approve pull
# requests" under Settings > Actions > General > Workflow permissions, or the
# create-pull-request step below will fail with a 403.
#
# Note: the only dynamic value used below (UPSTREAM_SHA) is a git commit SHA
# read via `git rev-parse`, passed through GITHUB_ENV rather than interpolated
# into a run: command -- it is not attacker-controlled free text.

on:
  schedule:
    # Runs daily. Scheduled workflows are disabled by GitHub after 60 days of
    # repo inactivity, so workflow_dispatch is kept as a manual fallback.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout openaustralia/.github
        uses: actions/checkout@v4
        with:
          repository: openaustralia/.github
          path: upstream

      - name: Mirror templates
        run: |
          set -euo pipefail
          rm -rf .github/ISSUE_TEMPLATE
          mkdir -p .github/ISSUE_TEMPLATE
          cp upstream/.github/ISSUE_TEMPLATE/*.md .github/ISSUE_TEMPLATE/
          cp upstream/.github/PULL_REQUEST_TEMPLATE.md .github/PULL_REQUEST_TEMPLATE.md

      - name: Record upstream commit SHA
        run: echo "UPSTREAM_SHA=$(git -C upstream rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Remove upstream checkout
        run: rm -rf upstream

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        env:
          UPSTREAM_SHA: ${{ env.UPSTREAM_SHA }}
        with:
          add-paths: |
            .github/ISSUE_TEMPLATE
            .github/PULL_REQUEST_TEMPLATE.md
          commit-message: |
            Sync issue/PR templates from openaustralia/.github@${{ env.UPSTREAM_SHA }}

            Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: sync/github-templates
          delete-branch: true
          title: "Sync issue/PR templates from openaustralia/.github"
          body: |
            Automated sync of `PULL_REQUEST_TEMPLATE.md` and `ISSUE_TEMPLATE/*.md`
            from [openaustralia/.github](https://github.com/openaustralia/.github)@${{ env.UPSTREAM_SHA }}.

            Review the diff and merge if it's right for this org.
          labels: automated
