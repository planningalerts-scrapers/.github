name: Sync community health files from openaustralia/.github

# Mirrors the issue/PR templates and FUNDING.yml from openaustralia/.github
# into this repo, opening a PR when upstream has changed. CONTRIBUTING.md is
# intentionally excluded and maintained locally -- see CONTRIBUTING.md.
#
# Uses actions/checkout and the gh CLI only (no third-party actions): this
# org's Actions policy allows only GitHub-owned/verified actions, and the gh
# CLI is a preinstalled runner tool rather than a marketplace action, so it
# isn't subject to that allowlist.
#
# The only dynamic value used below (UPSTREAM_SHA) is a git commit SHA read
# via `git rev-parse` -- not attacker-controlled free text.

on:
  schedule:
    # Runs daily. Scheduled workflows are disabled by GitHub after 60 days of
    # repo inactivity, so workflow_dispatch is kept as a manual fallback.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout openaustralia/.github
        uses: actions/checkout@v4
        with:
          repository: openaustralia/.github
          path: upstream

      - name: Mirror files and open a pull request if they changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          UPSTREAM_SHA="$(git -C upstream rev-parse --short HEAD)"

          rm -rf .github/ISSUE_TEMPLATE
          mkdir -p .github/ISSUE_TEMPLATE
          cp upstream/.github/ISSUE_TEMPLATE/*.md .github/ISSUE_TEMPLATE/
          cp upstream/.github/PULL_REQUEST_TEMPLATE.md .github/PULL_REQUEST_TEMPLATE.md
          cp upstream/.github/FUNDING.yml .github/FUNDING.yml
          rm -rf upstream

          SYNCED_PATHS=".github/ISSUE_TEMPLATE .github/PULL_REQUEST_TEMPLATE.md .github/FUNDING.yml"

          if git diff --quiet -- $SYNCED_PATHS; then
            echo "Community health files unchanged, nothing to do."
            exit 0
          fi

          BRANCH="sync/github-community-files"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add $SYNCED_PATHS
          git commit -s -m "Sync community health files from openaustralia/.github@${UPSTREAM_SHA}"
          git push --force origin "$BRANCH"

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "Pull request already open for $BRANCH."
          else
            gh pr create \
              --title "Sync community health files from openaustralia/.github" \
              --body "Automated sync of \`PULL_REQUEST_TEMPLATE.md\`, \`ISSUE_TEMPLATE/*.md\`, and \`FUNDING.yml\` from https://github.com/openaustralia/.github@${UPSTREAM_SHA}. Review the diff and merge if it's right for this org." \
              --head "$BRANCH" \
              --base main
          fi
